name: Automated Test Suite

on:
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select Browser for UI Tests'
        required: true
        default: 'Chrome'
        type: choice
        options:
          - Chrome
          - Firefox
          - Edge

jobs:
  execute-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore

      - name: Run API Tests
        id: api-tests
        run: dotnet test --no-build --verbosity normal --filter TestCategory=API --logger "trx;LogFileName=api_results.trx"

      - name: Run UI Tests
        if: always() 
        id: ui-tests
        env:
          BROWSER_TYPE: ${{ github.event.inputs.browser || 'Chrome' }}
        run: dotnet test --no-build --verbosity normal --filter TestCategory!=API --logger "trx;LogFileName=ui_results.trx" -e BROWSER=$BROWSER_TYPE

      - name: Upload Test Results and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-screenshots
          path: |
            **/TestResults/*.trx
            **/Screenshots/*.png
          retention-days: 7